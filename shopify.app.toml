client_id = "38d092e2a6318ff67aa5f0ee4e0fb8bc"
name = "Smart Store Sync"
application_url = "https://app.smartstoresync.com"
embedded = true
handle = "smart-store-sync-38d092e2"

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/privacy"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

[access_scopes]
scopes = "write_products,write_inventory,read_locations,write_files,read_publications,write_publications"

[auth]
redirect_urls = ["https://app.smartstoresync.com/auth/callback"]